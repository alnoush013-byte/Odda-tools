<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odda Tools | أدوات مجانية</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131b;color:#f4f6fb;font-family:Arial,sans-serif;line-height:1.7}
header{padding:28px 18px;text-align:center;background:#1c2031}
h1{font-size:36px;color:#f28ab2;margin:8px}
p{color:#bbc3d5}
main{max-width:900px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:#1c2232;border:1px solid #353d50;border-radius:15px;padding:18px}
h2{font-size:20px;margin-top:0}
textarea,input,select{width:100%;padding:12px;margin:7px 0;border-radius:9px;border:1px solid #454d60;background:#101521;color:white;font-size:16px}
textarea{min-height:110px}
button{padding:10px 14px;border:0;border-radius:9px;background:#f28ab2;color:#20111b;font-weight:bold;font-size:15px;margin:5px 3px;cursor:pointer}
.result{white-space:pre-wrap;overflow-wrap:anywhere;background:#111521;border-radius:8px;padding:10px;margin-top:10px;min-height:35px}
footer{text-align:center;padding:25px;color:#aeb7c9}
</style>
</head>
<body>
<header>
<h1>✦ Odda Tools</h1>
<p>أدوات مجانية تساعدك على الكتابة وصناعة المحتوى</p>
<button onclick="toggleLang()">العربية / English</button>
</header>
<main>
<div class="grid">

<section class="card">
<h2 data-en="Text Cleaner">📝 تنظيف النصوص</h2>
<textarea id="text" placeholder="الصق النص هنا..."></textarea>
<button onclick="cleanText()">تنظيف النص</button>
<button onclick="copyResult('clean')">نسخ النتيجة</button>
<div class="result" id="clean"></div>
</section>

<section class="card">
<h2 data-en="Word Counter">🔢 عداد الكلمات</h2>
<textarea id="counter" placeholder="اكتب النص هنا..." oninput="countWords()"></textarea>
<p>الكلمات: <b id="words">0</b></p>
<p>الأحرف: <b id="chars">0</b></p>
</section>

<section class="card">
<h2 data-en="Bio Generator">✨ مولّد النبذة الشخصية</h2>
<input id="topic" placeholder="اهتمامك أو مجالك">
<select id="style">
<option value="cool">رائع وبسيط</option>
<option value="fun">مرح ومضحك</option>
<option value="pro">احترافي</option>
</select>
<button onclick="makeBio()">اقترح نبذة</button>
<button onclick="copyResult('bio')">نسخ</button>
<div class="result" id="bio"></div>
</section>

<section class="card">
<h2 data-en="Hashtag Helper">#️⃣ مولّد الوسوم</h2>
<input id="subject" placeholder="موضوع منشورك">
<button onclick="makeTags()">إنشاء الوسوم</button>
<button onclick="copyResult('tags')">نسخ</button>
<div class="result" id="tags"></div>
</section>

<section class="card">
<h2 data-en="Video Prompt Builder">🎬 مساعد صناعة المحتوى</h2>
<input id="videoTopic" placeholder="موضوع الفيديو">
<select id="platform">
<option>YouTube Shorts</option>
<option>TikTok</option>
<option>Instagram Reels</option>
<option>Facebook</option>
</select>
<button onclick="makePrompt()">إنشاء برومبت</button>
<button onclick="copyResult('prompt')">نسخ</button>
<div class="result" id="prompt"></div>
</section>

<section class="card">
<h2>🔠 تحويل الأحرف الإنجليزية</h2>
<textarea id="caseText" placeholder="اكتب النص الإنجليزي"></textarea>
<button onclick="changeCase('upper')">UPPERCASE</button>
<button onclick="changeCase('lower')">lowercase</button>
<button onclick="changeCase('title')">Title Case</button>
<div class="result" id="caseResult"></div>
<button onclick="copyResult('caseResult')">نسخ النتيجة</button>
</section>

</div>
</main>
<footer>Odda Tools © 2026 — مجاني وسهل الاستخدام</footer>

<script>
function cleanText(){
let s=document.getElementById('text').value;
s=s.replace(/[ \t]+/g,' ').replace(/ *\n */g,'\n').replace(/\n{3,}/g,'\n\n').trim();
document.getElementById('clean').textContent=s;
}
function countWords(){
let s=document.getElementById('counter').value;
document.getElementById('words').textContent=(s.trim().match(/\S+/g)||[]).length;
document.getElementById('chars').textContent=s.length;
}
function makeBio(){
let t=document.getElementById('topic').value.trim()||'اهتماماتي';
let s=document.getElementById('style').value;
let a=s==='fun'?['محترف في تأجيل المهام 😎 | '+t,'أعيش على القهوة و'+t+' ☕']:s==='pro'?['مهتم بـ '+t+' | أتعلم وأتطور كل يوم','أشارك أفكاري وتجربتي في '+t]:['أبحث عن الإبداع في '+t+' ✨','رحلة مستمرة في عالم '+t];
document.getElementById('bio').textContent=a.join('\n');
}
function makeTags(){
let t=document.getElementById('subject').value.trim().replace(/\s+/g,'');
if(!t)t='محتوى';
document.getElementById('tags').textContent=['#'+t,'#صناعة_المحتوى','#إبداع','#تعلم','#اكسبلور','#يوميات'].join(' ');
}
function makePrompt(){
let t=document.getElementById('videoTopic').value.trim()||'موضوع شيق';
let p=document.getElementById('platform').value;
document.getElementById('prompt').textContent='أنشئ محتوى جذابًا لمنصة '+p+' عن '+t+'. ابدأ بخطاف قوي، ثم قدّم 3 معلومات مفيدة، واقترح مشاهد مناسبة، واختتم بدعوة للتفاعل. استخدم لغة طبيعية وتجنب المعلومات غير المؤكدة.';
}
function changeCase(mode){
let s=document.getElementById('caseText').value;
if(mode==='upper')s=s.toUpperCase();
if(mode==='lower')s=s.toLowerCase();
if(mode==='title')s=s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
document.getElementById('caseResult').textContent=s;
}
function copyResult(id){
let s=document.getElementById(id).textContent;
if(!s){alert('لا توجد نتيجة لنسخها بعد');return;}
if(navigator.clipboard&&navigator.clipboard.writeText){
navigator.clipboard.writeText(s).then(()=>alert('تم النسخ!')).catch(()=>fallbackCopy(s));
}else fallbackCopy(s);
}
function fallbackCopy(s){
let a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();alert('تم النسخ!');
}
let english=false;
function toggleLang(){
english=!english;
document.documentElement.lang=english?'en':'ar';
document.documentElement.dir=english?'ltr':'rtl';
document.querySelector('header p').textContent=english?'Free tools for writing and content creation':'أدوات مجانية تساعدك على الكتابة وصناعة المحتوى';
document.querySelectorAll('[data-en]').forEach(e=>e.textContent=e.dataset.en);
}
</script>
</body>
  </html>
